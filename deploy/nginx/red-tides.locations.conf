# Include inside the game's server {} block. Its root must point to dist/.
include /etc/nginx/private/red-tides-keys.conf;

error_page 403 =403 @red_tides_forbidden;
location @red_tides_forbidden {
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    return 403 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>403 · 访问被拒绝</title><h1>403 · 访问被拒绝</h1></html>';
}

# Run the room service on the same host, or substitute its container DNS name.
location ^~ /api/online/ {
    proxy_pass http://127.0.0.1:5175;
}

location ^~ /assets/ {
    if ($cookie_red_tides_assets != $game_asset_session) { return 403; }
    add_header Cache-Control "private, no-cache";
    try_files $uri =404;
}

location / {
    if ($arg_token != $game_access_token) { return 403; }
    add_header Referrer-Policy "no-referrer";
    add_header Cache-Control "private, no-store";
    add_header Set-Cookie "red_tides_assets=$game_asset_session; Path=/assets/; HttpOnly; SameSite=Strict";
    try_files /index.html =404;
}
