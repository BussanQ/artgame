# Omit URL parameters and Referer because page links contain the access token.
log_format game '$remote_addr "$request_method $uri" $status $body_bytes_sent';
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log game;
    include /etc/nginx/red-tides.locations.conf;
}
